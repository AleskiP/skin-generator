<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Générateur de skin custom · Édition Noël Mathou 2026</title>
  <meta name="description" content="Compose ton skin Minecraft 100% custom en choisissant chaque pièce, puis télécharge-le.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Three.js est embarqué dans js/vendor : aucun CDN, ça marche tel quel sur GitHub Pages -->
  <script type="importmap">
    { "imports": { "three": "./js/vendor/three.module.js" } }
  </script>
</head>
<body>
  <div class="snow" aria-hidden="true"></div>

  <header class="topbar">
    <h1>Générateur de skin custom <span>Édition Noël Mathou 2026</span></h1>
  </header>

  <main class="layout">
    <div id="categories" class="categories" aria-label="Choix des pièces du skin"></div>

    <aside class="stage" aria-label="Aperçu du skin">
      <div class="viewer-card">
        <div class="viewer-wrap">
          <canvas id="viewer" aria-label="Aperçu 3D du skin"></canvas>
        </div>
        <p class="hint">Glisse pour tourner · molette pour zoomer</p>
      </div>

      <div class="progress" aria-live="polite">
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <p id="progress">0 parties choisies</p>
      </div>

      <button id="validate" class="validate" type="button" disabled>
        <span id="validate-label">VALIDER</span>
      </button>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
